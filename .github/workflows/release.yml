name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows release
        run: cargo build --release --bin freedesk

      - name: Rename executable
        run: cp target/release/freedesk.exe freedesk.exe

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: freedesk.exe

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libasound2-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxfixes-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux release
        run: cargo build --release --bin freedesk

      - name: Package Linux binary
        run: |
          cp target/release/freedesk freedesk-linux-x86_64
          chmod +x freedesk-linux-x86_64
          tar -czvf freedesk-linux-x86_64.tar.gz freedesk-linux-x86_64 install.sh

      - name: Upload Linux Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            freedesk-linux-x86_64
            freedesk-linux-x86_64.tar.gz
            install.sh
